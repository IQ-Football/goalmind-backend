name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Tests
        run: npm test --if-present

  deploy-staging:
    name: Deploy to Staging
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            export PATH=$PATH:/usr/bin:/usr/local/bin
            cd /var/www/goalmind-backend
            git fetch origin staging
            git reset --hard origin/staging
            npm install --production
            # Apply migrations
            npm run db:init
            # Restart service
            pm2 restart goalmind-backend || pm2 start src/server.js --name goalmind-backend

  deploy-production:
    name: Deploy to Production
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            export PATH=$PATH:/usr/bin:/usr/local/bin
            cd /var/www/goalmind-backend
            git fetch origin main
            git reset --hard origin/main
            npm install --production
            # Apply migrations
            npm run db:init
            # Restart service
            pm2 restart goalmind-backend || pm2 start src/server.js --name goalmind-backend

  notifications:
    name: Notifications
    needs: [deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack/Discord (Stub)
        run: |
          if [[ "${{ needs.deploy-production.result }}" == "success" || "${{ needs.deploy-staging.result }}" == "success" ]]; then
            echo "SUCCESS: GoalMind Backend CI/CD Pipeline completed."
          else
            echo "FAILURE: GoalMind Backend CI/CD Pipeline failed."
          fi
